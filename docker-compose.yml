version: "3.9"

services:

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      - mongo

  frontend1:
    build: ./frontend1
    container_name: frontend1
    ports:
      - "3001:80"
    depends_on:
      - backend

  frontend2:
    build: ./frontend2
    container_name: frontend2
    ports:
      - "3002:80"
    depends_on:
      - backend

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: